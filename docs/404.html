layout: default
title: Page Not Found
no_menu: true

<style>
/* Full-page container */
.error-container {
  position: relative;
  height: 100vh;
  width: 100%;
}

/* Background image */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url('{{ site.baseurl }}/images/404.png') no-repeat center center/cover;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: -1;
}

/* Plain text link positioned over background */
.error-container a {
  position: fixed;
  top: 52%;    /* adjust this to move vertically */
  left: 40%;   /* centers horizontally */
  transform: translate(-50%, -50%);
  color: white; /* link color */
  text-decoration: underline; /* optional */
}
</style>

<div class="error-container">
  <a href="{{ site.baseurl }}/">Go back home</a>
</div>
